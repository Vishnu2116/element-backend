services:
  postgres:
    image: postgres:15-alpine
    container_name: element_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: element_db
      POSTGRES_USER: element_user
      POSTGRES_PASSWORD: element_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U element_user -d element_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: element_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ChooseAStrongRedisPassword123
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "ChooseAStrongRedisPassword123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
